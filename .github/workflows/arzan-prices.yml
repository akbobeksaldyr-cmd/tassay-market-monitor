name: Astana daily Arzan monitoring
on:
  schedule:
    - cron: '7 4 * * *' # ~09:07 Astana, UTC+05:00 (GitHub schedule runs in UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arzan-astana-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5' 'playwright>=1.45,<2'
          python -m playwright install --with-deps chromium
      - name: Integrate site once / update script references
        run: python scripts/install_arzan_integration.py
      - name: Collect actual public prices only
        run: python scripts/arzan_daily.py
      - name: Commit audited snapshot and site integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py km3.js index.html ru.html data/daily-prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily Astana price snapshot (unverified sources)"
            git push
          else
            echo 'No changes to commit'
          fi
