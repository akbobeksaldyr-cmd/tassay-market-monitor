<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TASSAY Market Monitor</title><style>
:root{font-family:Inter,system-ui,Arial;background:#071726;color:#ebf5ff}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:250px;background:#0b2235;border-right:1px solid #254457;padding:23px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;color:#fff;font-weight:900;letter-spacing:1px;padding:14px}.brand small{font-size:10px;color:#4ed6ce;display:block;letter-spacing:3px}.nav{width:100%;background:transparent;color:#c0d6e6;border:0;text-align:left;border-radius:10px;padding:12px;margin:2px 0;cursor:pointer;font-size:13px}.nav:hover,.nav.active{background:#113e54;color:#5fe9df}main{flex:1;min-width:0;padding:24px 32px;max-width:1500px;margin:auto}.top{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #284357;padding-bottom:16px}.muted{color:#8aaabb}.kicker{color:#4ae0d5;letter-spacing:2px;font-weight:700;font-size:11px}.header h1{font-size:clamp(24px,3vw,36px);margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:#10293e;border:1px solid #21455c;border-radius:14px;padding:20px}.metric{font-size:32px;font-weight:800;margin:8px 0;color:#f5ffff}.card small{color:#a0bacb}.panel{margin:18px 0}.panel h3{margin-top:0}select,input,textarea,button{font:inherit}select,input,textarea{color:inherit;background:#092134;border:1px solid #356078;border-radius:8px;padding:10px;max-width:100%}button.btn{background:#1cb9b2;color:#062c32;border:0;border-radius:9px;padding:10px 15px;font-weight:750;cursor:pointer}button.outline{background:#183a51;color:#d5f4ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #284559;text-align:left;padding:12px 9px}th{color:#9ab9c9}tr:hover td{background:#15344b}.good{color:#4ce3be}.warn{color:#efc16e}.bad{color:#ff8d95}.pill{padding:5px 9px;background:#24475a;border-radius:20px;font-size:12px}svg{max-width:100%;height:auto}.legend{display:flex;gap:20px;flex-wrap:wrap;margin:15px 0}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}.note{background:#18394d;padding:18px;border-radius:10px;line-height:1.7}.sectionText{line-height:1.85;color:#c6dce9}a{color:#63e4df}body.light{background:#eef5f8;color:#163047}body.light aside{background:#e4eff3}body.light .card,body.light .panel{background:#fff}body.light .nav{color:#174258}body.light .muted,body.light .sectionText{color:#37556a}body.light input,body.light select,body.light textarea{color:#17374a;background:#f7fbff}body.light .brand{color:#173c51}.menu{display:none}#toast{position:fixed;right:20px;bottom:20px;background:#185e63;padding:14px;border-radius:9px;display:none}@media(max-width:850px){aside{display:none;position:fixed;z-index:12;left:0;top:0;box-shadow:0 0 0 999px #0008}aside.open{display:block}.menu{display:inline-block}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr}.metric{font-size:24px}}@media print{aside,.top button,.controls{display:none!important}main{padding:0}.panel,.card{break-inside:avoid}body{background:#fff;color:#000}}
</style></head><body><div class="app"><aside id="sidebar"><div class="brand">◈ TASSAY<small>MARKET MONITOR</small></div><div id="nav"></div><p class="muted" style="padding:12px;font-size:11px">ҚР бәсекелестік құқығы • 2026</p></aside><main><div class="top"><div class="row"><button class="btn outline menu" onclick="document.querySelector('aside').classList.toggle('open')">☰</button><span class="kicker">RESEARCH LAB / KAZAKHSTAN</span></div><div class="row"><button class="btn outline" onclick="document.body.classList.toggle('light')">☀ Тақырып</button><button class="btn outline" onclick="window.print()">◩ Қорғау</button><button class="btn" id="loginBtn" onclick="login()">Әкімші кіру</button></div></div><div class="header"><p class="kicker">АКАДЕМИЯЛЫҚ ЗЕРТТЕУ</p><h1 id="title">TASSAY MARKET MONITOR</h1><p class="muted" id="subtitle">Бөтелкедегі су нарығындағы баға мониторингі және бәсекелестік-құқықтық талдау</p></div><div id="content"></div></main></div><div id="toast"></div>
<script>
let data=[], sources=[],admin=false,city='Астана',page=0,shopFilter='Барлығы',selectedDate='2026-10-19';
const sections=['Басты панель','Баға динамикасы','Бағалар және дәлелдемелер','Зерттеу әдістемесі','Астана нарығы','Монополия және шоғырлану','Нарық үлесі','Сыртқы факторлар','Қалаларды салыстыру','Қазақстанның бәсекелестік құқығы','Ғылыми қорытындылар','Дереккөздер','Сенімділікті тексеру','Қорғау режимі','ЖИ қолданылуы туралы қорытынды'];
const shops=['Arbuz','SMALL','Galmart'],colors=['#51d8dc','#ffd073','#9e8efd'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function val(n){return Number(n).toLocaleString('kk-KZ')+' ₸'}
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('kk-KZ',{day:'2-digit',month:'short',year:'numeric'})}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function nav(i){page=i;document.querySelector('aside').classList.remove('open');render()}
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json','X-Tassay-Request':'1',...(opt.headers||{})}});if(!r.ok)throw new Error((await r.json().catch(()=>({detail:r.status}))).detail);return r.json()}
async function refresh(){try{[data,sources]=await Promise.all([api('/api/prices'),api('/api/sources')]);admin=(await api('/api/session')).admin;render()}catch(e){toast('Деректерді жүктеу қатесі: '+e.message)}}
function render(){document.getElementById('nav').innerHTML=sections.map((s,i)=>'<button class="nav '+(page===i?'active':'')+'" onclick="nav('+i+')">'+['◫','⌁','▤','☷','◈','◉','▥','◴','⌖','⚖','✧','▣','✓','▰','✦'][i]+' &nbsp;'+s+'</button>').join('');document.getElementById('loginBtn').textContent=admin?'Әкімші ✓':'Әкімші кіру';document.getElementById('title').textContent=sections[page];document.getElementById('content').innerHTML=pages[page]()}
function btnCity(){return '<div class="row controls"><span class="muted">Қала:</span><select onchange="city=this.value;render()"><option '+(city==='Астана'?'selected':'')+'>Астана</option><option '+(city==='Алматы'?'selected':'')+'>Алматы</option></select><span class="pill">29.04–19.10.2026</span></div>'}
function rows(c=city){return data.filter(x=>x.city===c)}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:0}
function metric(t,v,sub=''){return '<div class="card"><small>'+t+'</small><div class="metric">'+v+'</div><small>'+sub+'</small></div>'}
function graph(c=city,mode='abs'){let obs=rows(c), dates=[...new Set(obs.map(x=>x.day))].sort(),values=obs.map(x=>x.price);if(!dates.length)return '';let max=mode==='abs'?Math.max(...values)+35:50,min=mode==='abs'?Math.max(0,Math.min(...values)-35):-50,w=850,h=320,left=54,top=25,r=22,b=45,plotW=w-left-r,plotH=h-top-b;let y=p=>top+(max-p)/(max-min)*plotH,x=i=>left+(dates.length<2?0:i/(dates.length-1)*plotW);let paths=shops.map((s,j)=>{let rs=dates.map(d=>obs.find(z=>z.day===d&&z.shop===s)).filter(Boolean);let first=rs[0]?.price||1;let points=rs.map(z=>({d:z.day,p:mode==='abs'?z.price:(z.price-first)/first*100}));return '<polyline points="'+points.map(z=>x(dates.indexOf(z.d))+','+y(z.p)).join(' ')+'" fill="none" stroke="'+colors[j]+'" stroke-width="3" stroke-linejoin="round"/>'+points.map(z=>'<circle cx="'+x(dates.indexOf(z.d))+'" cy="'+y(z.p)+'" r="5" fill="'+colors[j]+'"><title>'+s+' — '+fmt(z.d)+': '+(mode==='abs'?val(z.p):z.p.toFixed(1)+'%')+'</title></circle>').join('')}).join('');return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Баға динамикасы">'+Array.from({length:5},(_,i)=>{let v=min+(max-min)*i/4;return '<line x1="'+left+'" x2="'+(w-r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#3a5567" stroke-dasharray="4 5"/><text fill="#a0bacb" font-size="11" x="4" y="'+(y(v)+4)+'">'+v.toFixed(0)+'</text>'}).join('')+dates.map((d,i)=>'<text fill="#a0bacb" font-size="11" text-anchor="middle" x="'+x(i)+'" y="'+(h-10)+'">'+d.substring(5).replace('-','.')+'</text>').join('')+paths+'</svg><div class="legend">'+shops.map((s,i)=>'<span><span class="sw" style="background:'+colors[i]+'"></span>'+s+'</span>').join('')+'</div>'}
function dashboard(){let a=rows(),v=a.map(z=>z.price),last=shops.map(s=>a.filter(x=>x.shop===s).sort((x,y)=>y.day.localeCompare(x.day))[0]),changes=shops.map(s=>{let r=a.filter(x=>x.shop===s).sort((x,y)=>x.day.localeCompare(y.day));return {shop:s,delta:r.length?r.at(-1).price-r[0].price:0}});return btnCity()+'<div class="panel"><div class="kicker">ЗЕРТТЕУ СҰРАҒЫ</div><h3>2026 жылғы бақылау кезеңінде TASSAY 1 л газдалған суының бағасы қалай өзгерді?</h3><p class="sectionText">Тауар: TASSAY, газдалған минералды су, 1 л. Негізгі географиялық нарық — Астана. Алматы тек салыстырмалы талдау үшін қолданылады. Бақылау бағалары бәсекелестік туралы заң бұзушылықты дәлелдемейді.</p></div><div class="grid">'+metric('Бақылаулар',a.length,'Барлығы '+data.length+' жазба')+metric('Орташа баға',val(Math.round(avg(v))),'Таңдалған қала')+metric('Ең төменгі баға',val(Math.min(...v)))+metric('Ең жоғарғы баға',val(Math.max(...v)))+'</div><div class="split"><section class="panel"><h3>Дүкендер бойынша баға динамикасы</h3>'+graph()+'</section><section class="panel"><h3>Соңғы тіркелген бағалар</h3>'+last.map(x=>'<div class="note" style="margin:10px 0"><b>'+x.shop+'</b><div class="metric">'+val(x.price)+'</div><small>'+fmt(x.day)+'</small></div>').join('')+'</section></div><div class="panel"><h3>Алғашқы және соңғы бақылау арасындағы өзгеріс</h3>'+changes.map(x=>'<p>'+x.shop+': <b class="'+(x.delta>0?'bad':x.delta<0?'good':'muted')+'">'+(x.delta>0?'+':'')+x.delta+' ₸</b></p>').join('')+'</div>'}
function dynamics(){let a=rows();return btnCity()+'<section class="panel"><div class="row"><h3>Бағаның өзгерісі</h3><button class="btn outline" onclick="document.getElementById(\'dgraph\').innerHTML=graph(city,\'abs\')">₸</button><button class="btn outline" onclick="document.getElementById(\'dgraph\').innerHTML=graph(city,\'percent\')">%</button></div><div id="dgraph">'+graph()+'</div><p class="muted">Тек бес нақты бақыланған күн көрсетілген; аралық күндер бойынша деректер жоқ.</p></section><div class="panel"><h3>Баға өзгерісін есептеу</h3><div class="row"><select id="calcshop">'+shops.map(s=>'<option>'+s+'</option>')+'</select><select id="calcfrom">'+[...new Set(a.map(x=>x.day))].map(s=>'<option>'+s+'</option>')+'</select><select id="calcto">'+[...new Set(a.map(x=>x.day))].map((s,i)=>'<option '+(i===4?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn" onclick="calculate()">Есептеу</button></div><p id="calcresult" class="metric"></p></div>'}
function calculate(){let shop=document.getElementById('calcshop').value,one=data.find(x=>x.city===city&&x.shop===shop&&x.day===document.getElementById('calcfrom').value),two=data.find(x=>x.city===city&&x.shop===shop&&x.day===document.getElementById('calcto').value);document.getElementById('calcresult').textContent=one&&two?(two.price-one.price)+' ₸ / '+((two.price-one.price)*100/one.price).toFixed(2)+'%':'Деректер жоқ'}
function priceTable(){let rr=data.filter(x=>shopFilter==='Барлығы'||x.shop===shopFilter);return '<div class="panel"><div class="row"><select onchange="shopFilter=this.value;render()">'+['Барлығы',...shops].map(s=>'<option '+(shopFilter===s?'selected':'')+'>'+s+'</option>')+'</select><button class="btn outline" onclick="location.href=\'/api/export.csv\'">↓ CSV жүктеу</button>'+(admin?'<button class="btn" onclick="edit()">+ Бақылау қосу</button>':'<span class="pill">Өзгерту үшін әкімші режимі керек</span>')+'</div><div class="tablewrap"><table><thead><tr><th>Күні</th><th>Қала</th><th>Дүкен</th><th>Баға</th><th>Мәртебе</th><th>Дерек</th><th></th></tr></thead><tbody>'+rr.map(x=>'<tr><td>'+fmt(x.day)+'</td><td>'+x.city+'</td><td>'+x.shop+'</td><td><b>'+val(x.price)+'</b></td><td><span class="pill '+(x.status==='verified'?'good':'warn')+'">'+(x.status==='verified'?'Расталған':x.status==='missing'?'Дерек жоқ':'Расталмаған')+'</span></td><td>'+esc(x.notes).slice(0,55)+'</td><td>'+(admin?'<button class="btn outline" onclick="edit('+x.id+')">Өзгерту</button>':'')+'</td></tr>').join('')+'</tbody></table></div></div>'}
function edit(id){let x=data.find(y=>y.id===id)||{day:'2026-10-21',city:'Астана',shop:'Arbuz',price:0,status:'needs_review',source:'',notes:''};let body='<div class="panel"><h3>'+ (id?'Бақылауды өңдеу':'Бақылау қосу')+'</h3><div class="row"><input id="ed-day" type="date" value="'+x.day+'"><select id="ed-city">'+['Астана','Алматы'].map(s=>'<option '+(x.city===s?'selected':'')+'>'+s+'</option>')+'</select><select id="ed-shop">'+shops.map(s=>'<option '+(x.shop===s?'selected':'')+'>'+s+'</option>')+'</select><input id="ed-price" type="number" min="0" value="'+x.price+'"></div><p><select id="ed-status">'+['needs_review','verified','missing'].map(s=>'<option '+(x.status===s?'selected':'')+' value="'+s+'">'+s+'</option>')+'</select></p><p><input id="ed-source" placeholder="Дереккөз URL" style="width:100%" value="'+esc(x.source)+'"></p><textarea style="width:100%;min-height:100px" id="ed-notes">'+esc(x.notes)+'</textarea><p class="row"><button class="btn" onclick="save('+ (id||'null') +')">Сақтау</button><button class="btn outline" onclick="render()">Жабу</button></p></div>';document.getElementById('content').innerHTML=body}
async function save(id){let b={day:document.getElementById('ed-day').value,city:document.getElementById('ed-city').value,shop:document.getElementById('ed-shop').value,price:+document.getElementById('ed-price').value,status:document.getElementById('ed-status').value,source:document.getElementById('ed-source').value,notes:document.getElementById('ed-notes').value,channel:'online',discount:'',captured:''};try{await api('/api/prices'+(id?'/'+id:''),{method:id?'PUT':'POST',body:JSON.stringify(b)});toast('Сақталды');refresh()}catch(e){toast(e.message)}}
function generic(title,paras){return '<div class="panel"><h3>'+title+'</h3>'+paras.map(x=>'<p class="sectionText">'+x+'</p>').join('')+'</div>'}
function method(){return generic('Зерттеу әдістемесі',['Зерттеу нысаны — TASSAY газдалған минералды су, дәл 1 л; газдалмаған су, басқа көлем және брендтер араластырылмайды.','Салыстырмалы бөлшек баға мониторингі 2026 жылғы 29 сәуір – 19 қазан арасында бес нақты күнде жүргізілді. Әр қалада Arbuz, SMALL, Galmart дүкендері қамтылған.','Бастапқы кесте бақылау жазбалары болып есептеледі, оның өзі барлық бағаларды жеке тәуелсіз дәлелдеме ретінде растамайды. Суреттерде тауардың көлемін және сәйкестігін әрдайым толық анықтау мүмкін емес.','Шектеулер: жеңілдіктер, жеткізу ақысы, қордағы тауар қалдығы, ретроспективті деректер, аз үлгі, бақыланбаған аралық күндер. Бұл факторларды дәлелденген себептер деп көрсетуге болмайды.'])}
function market(){return generic('Астана қаласының релевантты нарығы',['Негізгі географиялық шекара — Астана қаласы. Алматы салыстыру үшін ғана алынған; қалалардағы бағалар айырмасы бірыңғай нарықтың барын дәлелдемейді.','Балама тауар шекаралары: 1 литрге жуық газдалған минералды су; барлық газдалған бөтелкедегі су; минералды және ауыз су. Нарық шекарасы өзара алмастырылу, өнім сипаттары, баға, тұтынушының таңдауы зерттелген соң ғана нақтыланады.','Компания А ретінде TASSAY брендімен байланысты расталған заңды тұлға немесе таңдалған бөлшек сатушы қарастырылуы мүмкін. Брендтің атауы өндіруші заңды тұлғасының дәлелі емес.'])}
function monopoly(){return generic('Монополия және нарықтық шоғырлану',['Монополия — нарық құрылымына қатысты ұғым; үстем жағдай — құқықтық-экономикалық бағалау нысаны; олигополия — бірнеше ірі жеткізуші әрекет ететін нарық құрылымы.','HHI = Σ (компаниялардың нарық үлесі)²; оны есептеу үшін осы нарықтың барлық тиісті қатысушыларының расталған үлестері қажет.','Бақыланған 30 баға нарық үлесін, үстем жағдайды, картельді, заңсыз келісімді немесе монополиялық жоғары бағаны анықтауға жеткіліксіз. Ұқсас бағаларды келісімнің дәлелі ретінде қарастыруға болмайды.'])}
function share(){return generic('Нарық үлесі',['Нарық үлесі (%) = компанияның сатылым көлемі / тиісті нарықтың жиынтық сатылым көлемі × 100%. Сандық немесе ақшалай өлшемдер бір аумақ, кезең, тауар шекарасы бойынша салыстырмалы болуы тиіс.','Қазіргі бөлшек бағалары компанияның сатылым көлемін немесе бүкіл нарықтың көлемін қамтымайды, сондықтан сенімді нарық үлесін есептеуге болмайды.'])+'<section class="panel"><h3>Нарық үлесінің калькуляторы</h3><div class="row"><input type="number" min="0" placeholder="Компанияның сатылымы" id="sales"><input type="number" min="0" placeholder="Нарықтың сатылымы" id="volume"><button class="btn" onclick="let a=+document.getElementById(\'sales\').value,b=+document.getElementById(\'volume\').value;document.getElementById(\'shareout\').textContent=b>0&&a<=b?(a/b*100).toFixed(2)+\'%\':\'Деректерді тексеріңіз\'">Есептеу</button></div><h3 id="shareout"></h3><p class="muted">Тек расталған, салыстырмалы көлемдерді қолданыңыз. Бұл үлгі деректері нарықтың үлесі емес.</p></section>'}
function factors(){return generic('Бағаға ықпал етуі мүмкін факторлар',['Инфляция, маусымдық сұраныс, көлік пен логистика, қаптаманың құны, теңге бағамы, өндірістік шығындар, акциялар, сауда желілерінің саясаты және салықтар ықтимал факторлар болып табылады.','Аталған факторлардың ешқайсысының нақты TASSAY бағасына себеп-салдарлық әсері осы 30 жазбамен расталмайды. Макрокөрсеткіштер мен салыстырмалы күндерге арналған ресми деректер қосылғаннан кейін ғана корреляция талдауға болады.'])}
function compare(){let pairs=[];for(let d of [...new Set(data.map(x=>x.day))])for(let s of shops){let a=data.find(x=>x.day===d&&x.city==='Астана'&&x.shop===s),b=data.find(x=>x.day===d&&x.city==='Алматы'&&x.shop===s);if(a&&b)pairs.push({d,s,a:a.price,b:b.price,delta:a.price-b.price})}return '<div class="grid">'+metric('Астана орташа бағасы',val(Math.round(avg(rows('Астана').map(x=>x.price)))))+metric('Алматы орташа бағасы',val(Math.round(avg(rows('Алматы').map(x=>x.price)))))+metric('Ең үлкен қалааралық айырма',val(Math.max(...pairs.map(x=>Math.abs(x.delta)))))+metric('Салыстырылған жұп',pairs.length)+'</div><div class="panel"><h3>Қалалар бойынша айырмашылықтар</h3><div class="tablewrap"><table><tr><th>Күні</th><th>Дүкен</th><th>Астана</th><th>Алматы</th><th>Айырма</th></tr>'+pairs.map(x=>'<tr><td>'+fmt(x.d)+'</td><td>'+x.s+'</td><td>'+val(x.a)+'</td><td>'+val(x.b)+'</td><td>'+x.delta+' ₸</td></tr>').join('')+'</table></div></div>'}
function law(){return generic('Қазақстан Республикасының бәсекелестік құқығы',['Кәсіпкерлік кодексі нарықтағы бәсекелестікті қорғау, үстем жағдай, бәсекелестікке қарсы келісімдер және уәкілетті органның бақылауы сияқты мәселелерді реттейді. Нақты баптар мен қолданыстағы редакцияны ресми «Әділет» порталында тексеру қажет.','Бақыланған бағалар, дүкендер арасындағы айырмалар және математикалық динамика — деректерден шығарылатын тұжырымдар. Монополиялық билік, картель, құқық бұзушылық пен себеп-салдар байланысы — қосымша дәлелдерсіз расталмайды.','Ресми мәтін: <a target="_blank" href="https://adilet.zan.kz/kaz/docs/K1500000375">ҚР Кәсіпкерлік кодексі</a>.'])}
function conclusions(){let a=rows('Астана');return generic('Ғылыми қорытындылар',['Астанада бақыланған бағалардың ең төменгісі '+val(Math.min(...a.map(x=>x.price)))+', ең жоғарғысы '+val(Math.max(...a.map(x=>x.price)))+'. Нақты өзгерістер тек берілген күндерге қатысты.','Әр дүкеннің өзгеру траекториясы әртүрлі. Баға сәйкестігі заң бұзуды дәлелдемейді. Алматыдағы бақылаулар салыстыруға арналған, бірақ Астана нарығының үлесін есептеуге кірмейді.','Болжамдар: маусымдылық, аймақтық логистика, жеңілдіктер мен сатушы стратегиялары әсер етуі мүмкін, бірақ әсері расталмаған.','Қосымша қажет деректер: нақты сатылым көлемі, тауар нарығының шекарасы, заңды өндіруші, нарық үлестері, мемлекеттік қолдау туралы ресми деректер және акциялардың дәлелдері.'])}
function bibliography(){return '<section class="panel"><h3>Ресми және бастапқы дереккөздер</h3>'+sources.map(x=>'<div class="note" style="margin:9px 0"><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.kind)+'</p><a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.url)+'</a><p>'+esc(x.claim)+'</p></div>').join('')+(admin?'<div class="row"><input id="srcTitle" placeholder="Атауы"><input id="srcUrl" placeholder="https://"><button class="btn" onclick="addSource()">Дерек қосу</button></div>':'')+'</section>'}
async function addSource(){try{await api('/api/sources',{method:'POST',body:JSON.stringify({title:document.getElementById('srcTitle').value,url:document.getElementById('srcUrl').value})});refresh()}catch(e){toast(e.message)}}
function check(){let r=data.filter(x=>x.status==='verified').length;return '<div class="grid">'+metric('Барлық бақылау',data.length)+metric('Расталған',r)+metric('Тексеруді қажет етеді',data.length-r)+metric('Деректері жеткіліксіз','Нарық үлесі')+'</div>'+generic('Сенімділік шектеулері',['Кестедегі 30 бағаның әрқайсысын нақты TASSAY газдалған 1 л тауарына сәйкестендіретін бастапқы материалдар қажет.','Астана, Galmart, 2026-08-28: кестеде 585 ₸, ұсынылған скриншотта 545 ₸. Бұл қайшылық шешілгенше дерек расталған болып саналмайды.','Бағалар мен өзгерістер есептеледі, бірақ себептер, нарық үлесі және заңдық жауапкершілік тұжырымдалмайды.'])}
function defend(){return dashboard()+'<div class="panel"><button class="btn" onclick="document.documentElement.requestFullscreen?.()">Толық экран</button><button class="btn outline" onclick="window.print()">Басып шығару / PDF</button></div>'}
function aiSummary(){return "<section class=\"panel\">\n<div class=\"kicker\">АКАДЕМИЯЛЫҚ АШЫҚТЫҚ • AI DISCLOSURE</div>\n<h3>Жасанды интеллект зерттеуде қалай қолданылды?</h3>\n<p class=\"sectionText\">Бұл оқу-зерттеу жобасын әзірлеуде жасанды интеллект (ЖИ) көмекші құрал ретінде қолданылды. ЖИ зерттеу деректерінің бастапқы дереккөзі немесе құқықтық дәлелдеме болып саналмайды.</p>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(205px,1fr))\">\n<div class=\"card\"><small>01 / ЖОСПАРЛАУ</small><h3>Зерттеу құрылымы</h3><p class=\"sectionText\">Талдау бөлімдерінің логикасын жүйелеуге, зерттеу сұрағын, әдіснамалық шектеулерді және қорғау құрылымын тұжырымдауға көмектесті.</p></div>\n<div class=\"card\"><small>02 / ПЛАТФОРМА</small><h3>Цифрлық құралдар</h3><p class=\"sectionText\">Веб-интерфейс, графиктер, сүзгілер, баға айырмасын есептеу және деректерді көрсету механизмдерінің кодын дайындауға көмектесті.</p></div>\n<div class=\"card\"><small>03 / ДЕРЕКТЕРДІ ТАЛДАУ</small><h3>Есептеулер</h3><p class=\"sectionText\">Пайдаланушы ұсынған 30 бағалық бақылауды кестеге енгізу және олардың негізінде орташа мәндерді, абсолюттік және пайыздық өзгерістерді есептеу үшін пайдаланылды.</p></div>\n<div class=\"card\"><small>04 / МӘТІН</small><h3>Түсіндіру және редакциялау</h3><p class=\"sectionText\">Әдістеме, бәсекелестікке қатысты ұғымдар және қорытындылар мәтіндерінің бастапқы нұсқаларын құрылымдауға көмектесті.</p></div>\n</div>\n<div class=\"note\" style=\"margin-top:16px\"><b>ЖИ қолданудың шекарасы:</b> ЖИ баға бақылауларын тәуелсіз түрде растаған жоқ, жаңа сатылым көлемдерін немесе нарықтық үлестерді анықтаған жоқ. Құқықтық нормалардың өзектілігі ресми дереккөздерден тексерілуі тиіс. Ұсынылған скриншоттар мен кестедегі сәйкессіздіктер қосымша тексеруді талап етеді.</div>\n<h3 style=\"margin-top:22px\">Қорытынды</h3>\n<p class=\"sectionText\">Жасанды интеллект зерттеудің көрнекілігін, есептеулердің қайталану мүмкіндігін және материалды жүйелеуді жақсартатын құрал болды. Дегенмен ғылыми қорытындылардың негізі — берілген бақылаулар, ашық көрсетілген әдістеме және тексерілетін дереккөздер. ЖИ ұсынған жауаптар өздігінен дәлел болып есептелмейді; деректерді тексеру және қорытындыларға жауапкершілік зерттеу авторында қалады.</p>\n</section>"}
