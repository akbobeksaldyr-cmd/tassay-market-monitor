function decodePage(encoded) {
  const binary = atob(encoded);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function showLanguage(lang) {
  document.getElementById("platform").srcdoc = decodePage(pages[lang]);
  document.getElementById("kzBtn").classList.toggle("active", lang === "kk");
  document.getElementById("ruBtn").classList.toggle("active", lang === "ru");
  document.getElementById("kzBtn").setAttribute("aria-pressed", String(lang === "kk"));
  document.getElementById("ruBtn").setAttribute("aria-pressed", String(lang === "ru"));
  document.getElementById("brand").textContent = lang === "kk" ? "Шырын нарығы · БШ3" : "Рынок соков · БШ3";
  document.documentElement.lang = lang;
}
showLanguage("kk");
